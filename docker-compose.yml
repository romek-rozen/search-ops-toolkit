# Copy .env.example to .env and set POSTGRES_PASSWORD, SESSION_SECRET (required)
# Or run ./setup.sh to generate secure values automatically

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: search_ops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGPORT: ${DB_PORT:-5432}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:${DB_PORT:-5432}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p ${DB_PORT:-5432}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    environment:
      PORT: ${APP_PORT:-3000}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:${DB_PORT:-5432}/search_ops
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      NEXT_PUBLIC_ADMIN_EMAIL: ${NEXT_PUBLIC_ADMIN_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - caddy_network

volumes:
  pgdata:

networks:
  caddy_network:
    external: true
    name: docker_caddy-network
